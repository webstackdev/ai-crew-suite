name: 'ESLint Config Sync Audit'
description: 'Audits decoupled ESLint config files against upstream @backstage/cli source drift using GitHub LLM resources.'

runs:
  using: 'composite'
  steps:
    - name: Set up Python environment
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Execute Alignment Check Script
      shell: bash
      env:
        GITHUB_TOKEN: ${{ env.GITHUB_TOKEN }}
        GITHUB_EVENT_PATH: ${{ env.GITHUB_EVENT_PATH }}
      run: python ${{ github.action_path }}/src/main.py
