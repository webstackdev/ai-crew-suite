name: 'Validate Monorepo Architecture'
description: 'Enforces directory layouts and @ai-crew-suite scope namespace standards'
runs:
  using: 'composite'
  steps:
    - name: Set up Python environment
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Run Script Self-Tests
      shell: bash
      run: |
        python3 ${{ github.action_path }}/tests/test_main.py
