name: Check Upstream ESLint Alignment

on:
  pull_request:
    paths:
      - "package.json"
      - "yarn.lock"
      - "packages/config-eslint/src/index.ts"

jobs:
  check-drift:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: read
      # Natively grants the GITHUB_TOKEN permissions to query GitHub's hosted LLMs
      copilot-requests: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Run ESLint Drift Audit
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_EVENT_PATH: ${{ github.event_path }}
        run: python .github/scripts/check_eslint_drift.py
